name: cursor-plugin

on:
  push:
    branches: [master]
    paths: &paths
      - '.claude/**'
      - 'skills/**'
      - 'commands/**'
      - 'opencode.jsonc'
      - 'scripts/cursor-plugin/**'
      - 'scripts/build-cursor-plugin.mjs'
      - 'scripts/sync-skills.sh'
      - 'plugins/**'
      - '.cursor-plugin/**'
  pull_request:
    branches: [master]
    paths: *paths

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "refs/heads/${{ github.base_ref || 'master' }}:refs/remotes/origin/${{ github.base_ref || 'master' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Build plugin
        run: node scripts/build-cursor-plugin.mjs
      - name: Check plugin
        run: node scripts/cursor-plugin/check.mjs
      - name: Drift check
        run: |
          git add -N plugins/
          git diff --exit-code -- plugins/ || { echo "plugins/ is out of date: run node scripts/build-cursor-plugin.mjs and commit"; exit 1; }
      # No root package.json: ajv is installed into an untracked root node_modules so validate.mjs can resolve it.
      - name: Install schema validator
        run: npm install --no-save --no-package-lock ajv@8 ajv-formats
      - name: Validate manifests
        run: node scripts/cursor-plugin/validate.mjs
      - name: Test hooks
        run: bash scripts/cursor-plugin/test-hooks.sh
